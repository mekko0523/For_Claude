name = "realtime-translate-session"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# GitHub Pages のオリジン(パスは含めない)。カンマ区切りで複数指定可。
# GitHub Actions からのデプロイ時は https://<owner>.github.io で上書きされる。
ALLOWED_ORIGIN = "https://mekko0523.github.io"
# 出力言語(本アプリは ja 固定)
TARGET_LANGUAGE = "ja"
# サーバー側ノイズ除去: near_field(口元のマイク) / far_field(離れたスピーカーや部屋の音)
NOISE_REDUCTION = "far_field"
# 要約メモ(/summary)に使うモデル
SUMMARY_MODEL = "gpt-6.1-sol"
# 話者分け(/diarize)に使う書き起こしモデル
DIARIZE_MODEL = "gpt-4o-transcribe-diarize"
# 日本語の文字起こしモードのモデル(受け付けられない場合は gpt-transcribe に自動で切り替え)
TRANSCRIBE_MODEL = "gpt-live-transcribe"
# 清書(/clean)に使う録音ファイル用の文字起こしモデル
CLEAN_MODEL = "gpt-transcribe"

# Secret はここに書かない(名前のみ記載)。GitHub Actions が GitHub Secrets から登録する。
#   OPENAI_API_KEY : OpenAI の API キー
#   APP_PASSPHRASE : フロントで入力する合言葉
# ローカル開発では .dev.vars に書く(.gitignore 済み)。.dev.vars.example を参照。
