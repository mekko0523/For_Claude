<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ハヤサポEnglish">
  <title>ハヤサポEnglish</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="status"><span id="dot" class="dot"></span><span id="statusText">停止中</span><span id="usage" class="usage"></span></div>
    <div class="bar-actions">
      <button id="notesBtn" class="icon-btn" type="button" aria-label="自己紹介と覚えていること">👤</button>
      <button id="historyBtn" class="icon-btn" type="button" aria-label="会話の記録">📜</button>
      <button id="newBtn" class="icon-btn" type="button" aria-label="新しい会話">🗒️</button>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="設定">⚙️</button>
    </div>
  </header>

  <nav id="sceneBar" class="scene-bar" aria-label="場面"></nav>

  <div id="notice" class="notice" hidden></div>

  <main id="log" class="log" aria-live="polite">
    <p id="empty" class="empty">「開始」を押して、相手に話してもらってください。<br>聞こえた英語と、あなたが読み上げる返事の候補がここに出ます。</p>
    <div id="live" class="turn them live" hidden><div class="en"></div><div class="ja"></div></div>
  </main>

  <section class="suggest" aria-label="返答候補">
    <div class="sg-head">
      <span id="sgTitle">返答候補</span>
      <button id="regenBtn" class="chip" type="button" disabled>🔄 別の候補</button>
    </div>
    <div id="cards" class="cards"></div>
  </section>

  <!-- 下部は1行: 自分が話す / 言いたいこと(単語だけでも可) / 英語にする / 開始・停止 -->
  <footer class="controls">
    <button id="meBtn" class="me-btn" type="button" aria-pressed="false" aria-label="自分が話す">🙋<span>自分</span></button>
    <form id="intentForm" class="intent">
      <input id="intent" type="text" enterkeyhint="send" autocomplete="off" placeholder="言いたいこと・単語">
      <button type="submit" class="send-btn" aria-label="英語にする">➤</button>
    </form>
    <button id="toggleBtn" class="go" type="button">▶ 開始</button>
  </footer>

  <dialog id="settings">
    <form method="dialog" class="settings-form">
      <h2>設定</h2>
      <label>合言葉
        <input id="passphrase" type="password" autocomplete="current-password">
      </label>
      <label>候補を作るAI
        <select id="modelSel">
          <option value="haiku" selected>Claude Haiku 5.5（速い・安い）</option>
          <option value="opus">Claude Opus 5.5（高品質・遅い・高い）</option>
        </select>
      </label>
      <label>相手の話が終わったとみなす間
        <select id="turnWaitSel">
          <option value="1000">短め（1秒）</option>
          <option value="1500">ふつう（1.5秒）</option>
          <option value="2500" selected>長め（2.5秒）</option>
          <option value="4000">とても長め（4秒）</option>
        </select>
      </label>
      <label class="check"><input id="showJa" type="checkbox" checked> 日本語訳を表示する</label>
      <p class="hint">合言葉と設定はこの端末にだけ保存されます。自己紹介メモと覚えていることは 👤 から開けます（サーバーに保存されるので消えません）。</p>
      <div class="settings-actions">
        <button value="close" class="primary">閉じる</button>
      </div>
    </form>
  </dialog>

  <dialog id="notes">
    <div class="settings-form">
      <div class="dlg-head">
        <h2>自分のメモ</h2>
        <button id="notesClose" class="chip" type="button">閉じる</button>
      </div>
      <details id="profileBox" class="fold">
        <summary>自己紹介メモ<span class="fold-hint">返事の中身に使います</span></summary>
        <textarea id="profile" rows="7" placeholder="例：名前は田中。日本の農薬メーカーで営業。英会話を週1回習っている。趣味は釣り。"></textarea>
      </details>
      <details id="memoryBox" class="fold">
        <summary>覚えていること<span class="fold-hint">会話が終わるたびに自動で更新</span></summary>
        <textarea id="memory" rows="12" placeholder="過去の会話で話した内容・話題・続きの話がここにたまります。直接書き直してもかまいません。"></textarea>
        <div class="row">
          <button id="memoryBtn" class="chip" type="button">今の会話から更新</button>
        </div>
      </details>
      <p id="notesStatus" class="hint"></p>
    </div>
  </dialog>

  <dialog id="history">
    <div class="settings-form">
      <div class="dlg-head">
        <h2 id="histTitle">会話の記録</h2>
        <button id="histClose" class="chip" type="button">閉じる</button>
      </div>
      <div id="histList" class="hist-list"></div>
      <div id="histView" hidden>
        <div id="histUsage" class="hist-usage"></div>
        <pre id="histText" class="hist-text"></pre>
        <div class="hist-actions">
          <button id="histCopy" class="chip" type="button">📋 コピー</button>
          <button id="histContinue" class="chip" type="button">▶ この会話を続ける</button>
          <button id="histDiag" class="chip" type="button">🩺 診断ログを送る</button>
          <button id="histDelete" class="chip danger" type="button">🗑 削除</button>
          <button id="histBack" class="chip" type="button">← 一覧</button>
        </div>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
