name = "talk-assist"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 画面(web/)もこの Worker から配信する。/api/ 以外は静的ファイル
[assets]
directory = "../web"
binding = "ASSETS"

[vars]
# 返答候補を作る Claude の既定のモデルと考える量(low / medium / high)
# 画面の設定で Haiku 5.5 / Opus 5.5 を選ぶと、そちらが優先される
CLAUDE_MODEL = "claude-haiku-5-5"
CLAUDE_EFFORT = "low"
# Soniox のリアルタイム音声認識モデル
SONIOX_MODEL = "stt-rt-v5"

# Secret はここに書かない(名前のみ記載)。GitHub Actions が GitHub Secrets から登録する。
#   ANTHROPIC_API_KEY : Claude の API キー
#   SONIOX_API_KEY    : Soniox の API キー
#   APP_PASSPHRASE    : 画面で入力する合言葉
# ローカル開発では .dev.vars に書く(.gitignore 済み)。.dev.vars.example を参照。

# 自己紹介メモ・覚えていることの保存先。id は GitHub Actions がデプロイ時に
# 「talk-assist-store」という名前の KV を探して(なければ作って)書き込む
[[kv_namespaces]]
binding = "STORE"
id = "KV_NAMESPACE_ID"
