name: FC27 Discord Community Bot (Hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      guild_id:
        description: "Override DISCORD_GUILD_ID for this manual run only (e.g. to test before the secret is registered). Leave blank to use the secret."
        required: false

permissions:
  contents: write

concurrency:
  group: discord-hourly-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly community bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ github.event.inputs.guild_id || secrets.DISCORD_GUILD_ID }}
        run: python -m fc26_watch.hourly_bot

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain hourly_bot_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add hourly_bot_state.json
            git commit -m "chore: update hourly bot state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
