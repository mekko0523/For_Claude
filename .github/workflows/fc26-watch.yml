name: FC27 Update Watch

on:
  schedule:
    # 3x/day, 8 hours apart: 03:00 / 11:00 / 19:00 JST == 18:00(prev day) /
    # 02:00 / 10:00 UTC.
    - cron: "0 2,10,18 * * *"
  workflow_dispatch:
    inputs:
      dump_links:
        description: "Print every link found on each source page (for tuning selectors)"
        type: boolean
        default: false
      dry_run:
        description: "Detect new items but don't send email or save state"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fc26-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dump_links }}" = "true" ]; then ARGS="$ARGS --dump-links"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m fc26_watch.main -v $ARGS

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update watcher state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
