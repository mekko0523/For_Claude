name: FC27 Discord Server Setup

on:
  workflow_dispatch:
    inputs:
      guild_id:
        description: "Discord server (guild) ID to build the channel layout in"
        required: true
      wipe_existing:
        description: "DESTRUCTIVE: delete ALL existing channels/categories in the server first"
        type: boolean
        default: false
      post_voice_guide:
        description: "Post the voice-channel usage guide message to ボイスチャンネル案内"
        type: boolean
        default: false
      post_report_guide:
        description: "Post the report-channel usage guide message to 運営への報告"
        type: boolean
        default: false
      post_channel_guides:
        description: "Post the usage guide message to every 雑談/お知らせ channel"
        type: boolean
        default: false
      update_existing_guides:
        description: "Edit the existing guide message in place instead of posting a new copy (applies to whichever post_* toggles above are ON)"
        type: boolean
        default: false
      debug_list_channel:
        description: "TEMP: list recent messages + pins in this channel label (e.g. 自己紹介) instead of running setup"
        required: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug -- list channel messages (temp)
        if: ${{ github.event.inputs.debug_list_channel != '' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python -m fc26_watch._debug_list_messages "${{ github.event.inputs.debug_list_channel }}"

      - name: Create/verify server layout
        if: ${{ github.event.inputs.debug_list_channel == '' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ github.event.inputs.guild_id }}
          DISCORD_WIPE_EXISTING: ${{ github.event.inputs.wipe_existing }}
        run: python -m fc26_watch.discord_setup

      - name: Commit channel/role id mapping
        if: ${{ github.event.inputs.debug_list_channel == '' }}
        run: |
          if [ -n "$(git status --porcelain discord_channels.json discord_roles.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add discord_channels.json discord_roles.json
            git commit -m "chore: update discord channel/role id mapping"
            git push
          else
            echo "No changes to discord_channels.json/discord_roles.json."
          fi

      - name: Post voice channel guide
        if: ${{ github.event.inputs.post_voice_guide == 'true' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.update_existing_guides }}" = "true" ]; then ARGS="--update"; fi
          python -m fc26_watch.announce voice_guide $ARGS

      - name: Post report channel guide
        if: ${{ github.event.inputs.post_report_guide == 'true' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.update_existing_guides }}" = "true" ]; then ARGS="--update"; fi
          python -m fc26_watch.announce report_guide $ARGS

      - name: Post 雑談/お知らせ channel guides
        if: ${{ github.event.inputs.post_channel_guides == 'true' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.update_existing_guides }}" = "true" ]; then ARGS="--update"; fi
          python -m fc26_watch.announce channel_guides $ARGS
